<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Crea tu cuenta en SmartInvoice y empieza a gestionar tus facturas.">
    <title>Registro — SmartInvoice</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>

<!-- Animated background orbs -->
<div style="position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden;">
    <div style="position:absolute; top:15%; right:15%; width:300px; height:300px; border-radius:50%; background:radial-gradient(circle, rgba(34,197,94,0.12) 0%, transparent 70%); animation: orbFloat1 14s ease-in-out infinite;"></div>
    <div style="position:absolute; bottom:15%; left:10%; width:260px; height:260px; border-radius:50%; background:radial-gradient(circle, rgba(99,102,241,0.12) 0%, transparent 70%); animation: orbFloat2 10s ease-in-out infinite;"></div>
</div>

<style>
    @keyframes orbFloat1 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-15px,25px)} }
    @keyframes orbFloat2 { 0%,100%{transform:translate(0,0)} 50%{transform:translate(20px,-20px)} }
</style>

<div class="auth-wrapper" style="position:relative; z-index:1;">
    <div class="auth-card">

        <!-- Logo -->
        <div class="auth-logo">
            <i class="fas fa-user-plus auth-logo-icon" style="background: linear-gradient(135deg, var(--accent) 0%, #16a34a 100%); -webkit-background-clip:text; -webkit-text-fill-color:transparent; background-clip:text;"></i>
            <h2>Crear Cuenta</h2>
            <p>Únete a SmartInvoice gratis</p>
        </div>

        <!-- Flash messages -->
        {% with messages = get_flashed_messages(with_categories=true) %}
          {% if messages %}
            {% for category, message in messages %}
              <div class="alert alert-{{ 'danger' if category == 'error' else 'success' }} mb-3">
                  <i class="fas fa-{{ 'exclamation-circle' if category == 'error' else 'check-circle' }} me-2"></i>{{ message }}
              </div>
            {% endfor %}
          {% endif %}
        {% endwith %}

        <!-- Form -->
        <form method="POST" action="{{ url_for('register') }}">
            <div class="mb-3">
                <label for="username" class="auth-label">
                    <i class="fas fa-user me-1"></i> Usuario
                </label>
                <input type="text" class="auth-input form-control" id="username" name="username"
                       placeholder="Elige un nombre de usuario" autocomplete="username" required>
            </div>
            <div class="mb-4">
                <label for="password" class="auth-label">
                    <i class="fas fa-lock me-1"></i> Contraseña
                </label>
                <input type="password" class="auth-input form-control" id="password" name="password"
                       placeholder="Mínimo 6 caracteres" autocomplete="new-password" required>
            </div>
            <button type="submit" class="auth-btn" id="register-btn"
                    style="background: linear-gradient(135deg, var(--accent) 0%, #16a34a 100%); box-shadow: 0 4px 16px var(--accent-glow); color: #052e16;">
                <i class="fas fa-user-plus me-2"></i> Crear Cuenta
            </button>
        </form>

        <div class="auth-link">
            ¿Ya tienes cuenta? <a href="{{ url_for('login') }}">Inicia sesión</a>
        </div>
    </div>
</div>

</body>
</html>
